    <rect x="29" y="44" width="4" height="4" rx="0.5" fill="#142D4E"/>
    <rect x="23" y="50" width="4" height="4" rx="0.5" fill="#142D4E"/>
    <rect x="29" y="50" width="4" height="4" rx="0.5" fill="#142D4E"/>
  </g>

  <!-- Wordmark "KONNEVIA" -->
  <text x="72" y="44" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#142D4E">KONNEVI</text>
  <!-- Stylized final 'A' with teal apex triangle -->
